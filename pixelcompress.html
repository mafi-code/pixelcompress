<style>
  /* Cyberpunk palette from Text-Todo (renderer/themes.js) – intentionally dark-only */
  :root {
    --bg: #070a12;
    --bg-2: #0b1020;
    --panel: #0e1424;
    --panel-2: #111a2e;
    --border: #1d2b46;
    --border-glow: #1f4d63;
    --text: #d7e6f5;
    --muted: #6f83a0;
    --emph: #ffffff;
    --accent: #00e5ff;
    --on-accent: #04121a;
    --magenta: #ff2fb0;
    --amber: #ffb020;
    --green: #38ffb3;
    --red: #ff3b5c;
    --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
    --glow: 0 0 6px color-mix(in srgb, var(--accent) 55%, transparent),
            0 0 18px color-mix(in srgb, var(--accent) 25%, transparent);
    --glow-magenta: 0 0 6px color-mix(in srgb, var(--magenta) 55%, transparent),
                    0 0 18px color-mix(in srgb, var(--magenta) 25%, transparent);
    --mono: "Cascadia Code", Consolas, "JetBrains Mono", "Courier New", monospace;
    --radius: 8px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background-color: var(--bg);
    background-image:
      linear-gradient(color-mix(in srgb, var(--accent) 3.5%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--accent) 3.5%, transparent) 1px, transparent 1px),
      radial-gradient(circle at 15% -10%, color-mix(in srgb, var(--magenta) 12%, transparent), transparent 45%),
      radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 40%);
    background-size: 34px 34px, 34px 34px, 100% 100%, 100% 100%;
    background-attachment: fixed;
  }
  ::selection { background: var(--magenta); color: #fff; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }

  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .brand img { width: 80px; height: 80px; flex: none; }
  h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin: 0 0 4px; color: var(--emph); }
  h1 .grad {
    background: linear-gradient(90deg, var(--magenta), #8b5cff 45%, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px color-mix(in srgb, var(--magenta) 40%, transparent));
  }
  .sub { color: var(--muted); margin: 0; }

  .drop {
    display: block;
    position: relative;
    border: 1px dashed var(--border-glow);
    border-radius: var(--radius);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    padding: 40px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .drop:hover { border-color: var(--accent); box-shadow: var(--glow); }
  .drop.over { border-color: var(--magenta); box-shadow: var(--glow-magenta); }
  .drop strong {
    display: block; margin-bottom: 6px;
    font-family: var(--mono); font-size: 1rem; letter-spacing: 2px; text-transform: uppercase;
    color: var(--emph); text-shadow: var(--glow-magenta);
  }
  .drop strong::before { content: "» "; color: var(--magenta); }
  .drop span { color: var(--muted); font-size: .9rem; }
  .drop input { display: none; }

  .settings {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin: 20px 0;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 2px solid var(--magenta);
    border-radius: var(--radius);
  }
  .field label {
    display: block; margin-bottom: 6px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row input { min-width: 0; }
  .field select, .field input[type=number] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-2);
    color: var(--text);
    font: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .field select:focus, .field input[type=number]:focus { outline: none; border-color: var(--accent); box-shadow: var(--glow); }
  .field select:disabled { opacity: .5; }
  .field input::placeholder { color: var(--muted); }
  select option { background: var(--panel); }
  .field input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .hidden { display: none !important; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar .summary { color: var(--muted); font-family: var(--mono); font-size: .85rem; border-left: 2px solid var(--magenta); padding-left: 8px; }
  button {
    border: 1px solid var(--border-glow);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
    transition: border-color .15s, box-shadow .15s, color .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow); }
  button.primary {
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--magenta) 18%, transparent));
    border-color: var(--accent);
    color: var(--accent);
    text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  button.primary:hover { filter: brightness(1.15); }

  .list { display: grid; gap: 16px; }
  .card {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: 16px;
    padding: 16px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-left: 2px solid var(--magenta);
    border-radius: var(--radius);
    transition: border-color .15s, box-shadow .15s;
  }
  .card:hover { border-color: var(--border-glow); border-left-color: var(--magenta); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 8%, transparent), 0 8px 24px rgba(0,0,0,.4); }
  @media (max-width: 640px) { .card { grid-template-columns: 1fr; } }

  .compare {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
    background:
      repeating-conic-gradient(var(--bg-2) 0 25%, var(--panel-2) 0 50%) 0 0 / 16px 16px;
    aspect-ratio: 4 / 3;
  }
  .compare img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    user-select: none; pointer-events: none;
  }
  .compare .top { clip-path: inset(0 0 0 50%); }
  .compare input[type=range] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: ew-resize;
  }
  .compare .line {
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 2px; background: var(--accent); box-shadow: var(--glow);
    pointer-events: none;
  }
  .compare .tag {
    position: absolute; top: 8px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    padding: 2px 8px; border-radius: 3px;
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    pointer-events: none;
  }
  .compare .tag.l { left: 8px; color: var(--magenta); border: 1px solid var(--magenta); }
  .compare .tag.r { right: 8px; color: var(--accent); border: 1px solid var(--accent); }

  .info h3 { margin: 0 0 8px; font-size: 1rem; word-break: break-all; color: var(--emph); text-shadow: var(--glow); }
  .info h3::before { content: "▎"; color: var(--magenta); margin-right: 4px; text-shadow: var(--glow-magenta); }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .9rem; margin: 0 0 12px; }
  .stats dt { color: var(--magenta); font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; align-self: center; }
  .stats dd { margin: 0; font-variant-numeric: tabular-nums; }
  .saving {
    font-family: var(--mono); font-size: 1.8rem; font-weight: 700; margin-bottom: 4px;
    color: var(--green); text-shadow: 0 0 10px color-mix(in srgb, var(--green) 45%, transparent);
  }
  .saving.bad { color: var(--amber); text-shadow: 0 0 10px color-mix(in srgb, var(--amber) 45%, transparent); }
  .note { font-size: .85rem; color: var(--amber); margin: 0 0 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .busy { color: var(--magenta); font-family: var(--mono); font-size: .85rem; letter-spacing: 1px; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
</style>
</head>

    <div>
      <h1>Pixel<span class="grad">Compress</span></h1>
      <p class="sub">Images are compressed right in your browser and never leave your computer.</p>
    </div>
  </header>

  <label class="drop" id="drop">
    <strong>Drop images here</strong>
    <span>or click to choose · Ctrl+V to paste · JPG, PNG, WebP, GIF, BMP</span>
    <input type="file" id="file" accept="image/*" multiple>
  </label>

  <section class="settings">
    <div class="field">
      <label for="format">Output format</label>
      <select id="format">
        <option value="original">Same as original</option>
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp" selected>WebP</option>
        <option value="image/avif">AVIF</option>
        <option value="image/png">PNG (resize only)</option>
      </select>
    </div>
    <div class="field">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="quality">Set quality</option>
        <option value="target">Reach target size</option>
      </select>
    </div>
    <div class="field" id="qualityField">
      <label for="quality">Quality: <span id="qualityVal">75</span>%</label>
      <input type="range" id="quality" min="5" max="100" value="75">
    </div>
    <div class="field hidden" id="targetField">
      <label for="target">Max. file size (KB)</label>
      <input type="number" id="target" min="5" value="200">
    </div>
    <div class="field">
      <label for="maxW">Max. dimensions (px)</label>
      <div class="row">
        <input type="number" id="maxW" min="1" placeholder="Width" title="Leave empty = original width">
        <input type="number" id="maxH" min="1" placeholder="Height" title="Leave empty = original height">
      </div>
    </div>
  </section>

  <div class="toolbar hidden" id="toolbar">
    <span class="summary" id="summary"></span>
    <div class="actions">
      <button id="clear">Clear list</button>
      <button class="primary" id="downloadAll">Download all</button>
    </div>
  </div>

  <div class="list" id="list"></div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const els = {
    drop: $('drop'), file: $('file'), format: $('format'), mode: $('mode'),
    quality: $('quality'), qualityVal: $('qualityVal'), qualityField: $('qualityField'),
    target: $('target'), targetField: $('targetField'), maxW: $('maxW'), maxH: $('maxH'),
    list: $('list'), toolbar: $('toolbar'), summary: $('summary'),
    clear: $('clear'), downloadAll: $('downloadAll'),
  };

  const EXT = { 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/avif': 'avif', 'image/png': 'png' };
  const items = [];

  // Hide formats this browser cannot encode (e.g. AVIF in Chrome/Firefox)
  const probe = document.createElement('canvas');
  probe.width = probe.height = 1;
  for (const opt of [...els.format.options]) {
    if (opt.value !== 'original' && !probe.toDataURL(opt.value).startsWith('data:' + opt.value)) opt.remove();
  }
  const encodable = new Set([...els.format.options].map(o => o.value));

  // "Same as original": keep the input format if the browser can encode it (GIF/BMP → WebP)
  function resolveFormat(format, file) {
    if (format !== 'original') return format;
    if (encodable.has(file.type)) return file.type;
    return encodable.has('image/webp') ? 'image/webp' : 'image/jpeg';
  }
  try {
    const saved = JSON.parse(localStorage.getItem('pixelcompress') || 'null');
    if (saved) {
      if ([...els.format.options].some(o => o.value === saved.format)) els.format.value = saved.format;
      els.mode.value = saved.mode || 'quality';
      els.quality.value = saved.quality || 75;
      els.target.value = saved.target || 200;
      els.maxW.value = saved.maxW || '';
      els.maxH.value = saved.maxH || '';
    }
  } catch {}

  function settings() {
    return {
      format: els.format.value,
      mode: els.mode.value,
      quality: Number(els.quality.value) / 100,
      target: Math.max(1, Number(els.target.value) || 200) * 1024,
      maxW: Number(els.maxW.value) || Infinity,
      maxH: Number(els.maxH.value) || Infinity,
    };
  }

  function syncUI() {
    const lossless = els.format.value === 'image/png';
    els.qualityVal.textContent = els.quality.value;
    els.qualityField.classList.toggle('hidden', lossless || els.mode.value !== 'quality');
    els.targetField.classList.toggle('hidden', els.mode.value !== 'target');
    try {
      localStorage.setItem('pixelcompress', JSON.stringify({
        format: els.format.value, mode: els.mode.value, quality: els.quality.value,
        target: els.target.value, maxW: els.maxW.value, maxH: els.maxH.value,
      }));
    } catch {}
  }

  const fmt = bytes => bytes < 1024 ? bytes + ' B'
    : bytes < 1024 * 1024 ? (bytes / 1024).toFixed(1) + ' KB'
    : (bytes / 1024 / 1024).toFixed(2) + ' MB';

  function fitSize(w, h, maxW, maxH) {
    const scale = Math.min(1, maxW / w, maxH / h);
    return [Math.max(1, Math.round(w * scale)), Math.max(1, Math.round(h * scale))];
  }

  function render(bitmap, w, h, type) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); } // JPEG has no transparency
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bitmap, 0, 0, w, h);
    return c;
  }

  const encode = (canvas, type, q) => new Promise((res, rej) =>
    canvas.toBlob(b => b ? res(b) : rej(new Error('Encoding failed')), type, q));

  async function compress(bitmap, s) {
    let [w, h] = fitSize(bitmap.width, bitmap.height, s.maxW, s.maxH);
    const lossless = s.format === 'image/png';

    if (s.mode === 'quality') {
      const q = lossless ? null : s.quality;
      return { blob: await encode(render(bitmap, w, h, s.format), s.format, q ?? undefined), w, h, q };
    }

    // Target size: binary search over quality, shrinking the dimensions as well if needed.
    // PNG is lossless – resizing is the only option there.
    let best = null;
    for (let round = 0; round < 12; round++) {
      const canvas = render(bitmap, w, h, s.format);
      let lo = 0.05, hi = 0.95;
      let fit = null;
      const floor = await encode(canvas, s.format, lossless ? undefined : lo);
      if (floor.size <= s.target) {
        fit = { blob: floor, q: lossless ? null : lo };
        for (let i = 0; i < 7 && !lossless; i++) {
          const mid = (lo + hi) / 2;
          const b = await encode(canvas, s.format, mid);
          if (b.size <= s.target) { fit = { blob: b, q: mid }; lo = mid; } else { hi = mid; }
        }
      }
      if (fit) return { ...fit, w, h };
      best = { blob: floor, q: lossless ? null : lo, w, h };
      // Shrink the area roughly in proportion to the overshoot
      const factor = Math.max(0.5, Math.min(0.9, Math.sqrt(s.target / floor.size)));
      if (w * factor < 16 || h * factor < 16) break;
      w = Math.round(w * factor); h = Math.round(h * factor);
    }
    return { ...best, missed: true };
  }

  function outName(item) {
    const base = item.file.name.replace(/\.[^.]+$/, '') || 'image';
    return `${base}-compressed.${EXT[item.result.blob.type] || 'img'}`;
  }

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function buildCard(item) {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="compare">
        <img class="orig" alt="Original">
        <img class="top" alt="Compressed">
        <div class="line"></div>
        <span class="tag l">Original</span>
        <span class="tag r">Compressed</span>
        <input type="range" min="0" max="100" value="50" aria-label="Move comparison">
      </div>
      <div class="info">
        <h3></h3>
        <div class="body"><p class="busy">Compressing …</p></div>
      </div>`;
    card.querySelector('h3').textContent = item.file.name;
    card.querySelector('.orig').src = item.origUrl;
    const top = card.querySelector('.top'), line = card.querySelector('.line');
    card.querySelector('.compare input').addEventListener('input', e => {
      top.style.clipPath = `inset(0 0 0 ${e.target.value}%)`;
      line.style.left = e.target.value + '%';
    });
    item.card = card;
    els.list.prepend(card);
  }

  function showResult(item) {
    const { result: r, file, bitmap } = item;
    const top = item.card.querySelector('.top');
    if (item.resultUrl) URL.revokeObjectURL(item.resultUrl);
    item.resultUrl = URL.createObjectURL(r.blob);
    top.src = item.resultUrl;

    const pct = Math.round((1 - r.blob.size / file.size) * 100);
    const bigger = r.blob.size >= file.size;
    const sign = pct > 0 ? '−' : pct < 0 ? '+' : '±';
    const hint = r.blob.type === 'image/png'
      ? 'PNG is lossless – choose JPEG or WebP or reduce the dimensions for smaller files.'
      : 'Try another format or a lower quality.';
    const body = item.card.querySelector('.body');
    body.innerHTML = `
      <div class="saving ${bigger ? 'bad' : ''}">${sign}${Math.abs(pct)}%</div>
      <dl class="stats">
        <dt>Before</dt><dd>${fmt(file.size)} · ${bitmap.width}×${bitmap.height}</dd>
        <dt>After</dt><dd>${fmt(r.blob.size)} · ${r.w}×${r.h}</dd>
        <dt>Format</dt><dd>${(EXT[r.blob.type] || r.blob.type).toUpperCase()}${r.q != null ? ` · quality ${Math.round(r.q * 100)}%` : ''}</dd>
      </dl>
      ${r.missed ? '<p class="note">Target size not reachable – showing the smallest possible result.</p>' : ''}
      ${bigger ? `<p class="note">The result is not smaller than the original. ${hint}</p>` : ''}
      <div class="actions">
        <button class="primary dl">Download</button>
        <button class="rm">Remove</button>
      </div>`;
    body.querySelector('.dl').onclick = () => download(r.blob, outName(item));
    body.querySelector('.rm').onclick = () => removeItem(item);
  }

  async function process(item) {
    const run = ++item.run;
    item.card.querySelector('.body').innerHTML = '<p class="busy">Compressing …</p>';
    try {
      const s = settings();
      const result = await compress(item.bitmap, { ...s, format: resolveFormat(s.format, item.file) });
      if (run !== item.run || !items.includes(item)) return; // stale
      item.result = result;
      showResult(item);
    } catch (err) {
      if (run === item.run) item.card.querySelector('.body').innerHTML = `<p class="note">Error: ${err.message}</p>`;
    }
    updateSummary();
  }

  function removeItem(item) {
    items.splice(items.indexOf(item), 1);
    item.card.remove();
    URL.revokeObjectURL(item.origUrl);
    if (item.resultUrl) URL.revokeObjectURL(item.resultUrl);
    item.bitmap.close?.();
    updateSummary();
  }

  function updateSummary() {
    els.toolbar.classList.toggle('hidden', items.length === 0);
    const done = items.filter(i => i.result);
    const before = done.reduce((s, i) => s + i.file.size, 0);
    const after = done.reduce((s, i) => s + i.result.blob.size, 0);
    els.summary.textContent = done.length
      ? `${items.length} image${items.length > 1 ? 's' : ''} · ${fmt(before)} → ${fmt(after)}`
      : `${items.length} image${items.length > 1 ? 's' : ''} in progress …`;
  }

  async function addFiles(files) {
    for (const file of files) {
      // some sources provide no MIME type – fall back to the file extension
      if (!file.type.startsWith('image/') && !/\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(file.name)) continue;
      let bitmap;
      try {
        bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
      } catch {
        alert(`"${file.name}" could not be read.`);
        continue;
      }
      const item = { file, bitmap, origUrl: URL.createObjectURL(file), run: 0 };
      items.push(item);
      buildCard(item);
      updateSummary();
      process(item);
    }
  }

  let timer;
  function reprocessAll() {
    syncUI();
    clearTimeout(timer);
    timer = setTimeout(() => items.forEach(process), 250);
  }

  // Events
  els.file.addEventListener('change', () => { addFiles(els.file.files); els.file.value = ''; });
  ['dragenter', 'dragover'].forEach(t => els.drop.addEventListener(t, e => { e.preventDefault(); els.drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => els.drop.addEventListener(t, () => els.drop.classList.remove('over')));
  // A drop on the area bubbles up to the window handler – so handle it only there
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); addFiles(e.dataTransfer.files); });
  window.addEventListener('paste', e => {
    const files = [...e.clipboardData.items].filter(i => i.kind === 'file').map(i => i.getAsFile());
    if (files.length) addFiles(files);
  });

  [els.format, els.mode, els.quality, els.target, els.maxW, els.maxH]
    .forEach(el => el.addEventListener('input', reprocessAll));

  els.clear.addEventListener('click', () => [...items].forEach(removeItem));
  els.downloadAll.addEventListener('click', async () => {
    for (const item of items.filter(i => i.result)) {
      download(item.result.blob, outName(item));
      await new Promise(r => setTimeout(r, 300)); // otherwise browsers block multiple downloads
    }
  });

  syncUI();
})();
</script>
</body>
</html>
